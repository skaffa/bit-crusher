<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA_CRUSHER // GITHUB_PAGES_OPTIMIZED</title>
    <script src="https://unpkg.com/omggif@1.0.10/omggif.js"></script>
    <script src="https://unpkg.com/gifshot@0.4.5/dist/gifshot.min.js"></script>
    <style>
        :root {
            --bg: #09090b; --panel: #141416; --border: #27272a; --border-focus: #52525b;
            --text: #f4f4f5; --text-muted: #71717a; --accent: #ff4500; --accent-dim: #3f1a0d;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg); color: var(--text); font-family: system-ui; padding: 2rem; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 2rem; }
        #drop-zone { border: 1px dashed var(--border); background: var(--panel); padding: 4rem 2rem; text-align: center; cursor: pointer; }
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .hidden { display: none !important; }
        .panel { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border); }
        input[type="range"]::-webkit-slider-thumb { height: 14px; width: 14px; background: var(--text); -webkit-appearance: none; cursor: pointer; }
        button { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 0.75rem; font-family: var(--font-mono); font-weight: 700; cursor: pointer; text-transform: uppercase; }
        button:hover { background: var(--accent); color: var(--text); }
        .progress-container { margin-top: 1rem; border: 1px solid var(--border); height: 20px; position: relative; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
        .comparison-window { border: 1px solid var(--border); position: relative; width: 100%; overflow: hidden; }
        .comp-layer { width: 100%; display: flex; align-items: center; justify-content: center; }
        .comp-layer img { width: 100%; max-height: 50vh; object-fit: contain; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>DATA_CRUSHER</h1></header>
    <div id="drop-zone"><p>Drop media here</p><input type="file" id="file-input" style="display:none"></div>
    <div id="workspace" class="workspace hidden">
        <div class="panel">
            <div id="config-fields"></div>
            <button id="process-btn">Execute Compression</button>
            <div id="progress-wrapper" class="progress-container hidden"><div id="progress-bar" class="progress-bar"></div></div>
        </div>
        <div class="panel">
            <div class="comparison-window"><div class="comp-layer" id="layer-orig-box"></div></div>
            <button id="download-btn" class="hidden">Export</button>
        </div>
    </div>
</div>

<script>
    let activeFile = null, originalDimensions = {w:0, h:0};
    const dropZone = document.getElementById('drop-zone'), workspace = document.getElementById('workspace');

    dropZone.addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', (e) => handleFile(e.target.files[0]));

    function handleFile(file) {
        activeFile = file;
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            originalDimensions = {w: img.width, h: img.height};
            document.getElementById('layer-orig-box').innerHTML = `<img src="${img.src}">`;
            workspace.classList.remove('hidden');
            document.getElementById('config-fields').innerHTML = `
                <label>Scale: <span id="val-s">50%</span></label>
                <input type="range" id="param-scale" min="10" max="100" value="50" oninput="document.getElementById('val-s').textContent=this.value+'%'">
            `;
        };
    }

    document.getElementById('process-btn').addEventListener('click', () => {
        document.getElementById('progress-wrapper').classList.remove('hidden');
        const scale = document.getElementById('param-scale').value / 100;
        
        gifshot.createGIF({
            gifWidth: Math.round(originalDimensions.w * scale),
            gifHeight: Math.round(originalDimensions.h * scale),
            numWorkers: navigator.hardwareConcurrency || 2,
            progressCallback: (p) => document.getElementById('progress-bar').style.width = (p*100) + '%'
        }, (obj) => {
            if(!obj.error) {
                const link = document.createElement('a');
                link.href = obj.image;
                link.download = "crushed.gif";
                document.getElementById('download-btn').classList.remove('hidden');
                document.getElementById('download-btn').onclick = () => link.click();
            }
        });
    });
</script>
</body>
</html>
